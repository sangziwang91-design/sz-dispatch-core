[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sz-dispatch-core"
version = "0.1.0"
description = "Evidence-first DAG dispatch core for bounded LLM workloads."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Sangzi Wang" }
]
keywords = [
  "llm",
  "orchestration",
  "asyncio",
  "dag",
  "dispatch",
  "agent-evaluation"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed"
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sz-dispatch = "sz_dispatch.cli:main"

[project.urls]
Homepage = "https://github.com/sangziwang91-design/sz-dispatch-core"
Repository = "https://github.com/sangziwang91-design/sz-dispatch-core"
Issues = "https://github.com/sangziwang91-design/sz-dispatch-core/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.package-data]
sz_dispatch = ["py.typed"]
