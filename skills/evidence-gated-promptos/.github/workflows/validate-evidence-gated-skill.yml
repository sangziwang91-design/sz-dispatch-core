name: validate evidence-gated skill

on:
  push:
    paths:
      - "SKILL.md"
      - "references/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-evidence-gated-skill.yml"
  pull_request:
    paths:
      - "SKILL.md"
      - "references/**"
      - "assets/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-evidence-gated-skill.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate skill structure
        run: python scripts/validate_skill.py .
      - name: Run tests
        run: python -m unittest discover -s tests -v
